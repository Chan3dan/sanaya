services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  sanaya-core:
    build:
      context: .
      dockerfile: Dockerfile.core
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
  sanaya-api:
    image: node:20-alpine
    working_dir: /app/api
    command: sh -c "npm install && npm run dev"
    env_file: .env
    ports:
      - "3001:3001"
    volumes:
      - .:/app
    depends_on:
      - redis
  sanaya-dashboard:
    image: node:20-alpine
    working_dir: /app/dashboard
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      - sanaya-api
